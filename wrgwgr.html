<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beEBETBAE</title>
</head>

<body>
    <header>
        <div class="headerContent">
            <div class="logo">
                <img src="img/logo.png" alt="" class="logoImg">


            </div>
            <div class="menu">
                <img src="img/Hamburguer.png" alt="">
            </div>
            <nav class="menuInfo">
                <img src="img/Fechar.png" alt="" class="close">
                <a href="Catalogo.html">Nossos brinquedos</a>
                <a href="Contato.html">Contato</a>
                <a href="Home.html">Home</a>
                <a href="Doe.html"><button>Doe agora</button></a>
            </nav>
        </div>
    </header>


    <script>
        let btn = document.querySelector(".menu")
        let menu = document.querySelector(".menuInfo")
        let menuClose = document.querySelector(".close")


        btn.addEventListener("click",
            () => {
                menu.classList.add("itsOpen")
                btn.classList.add("a")
            }
        )

        menuClose.addEventListener("click",
            () => {
                menu.classList.remove("itsOpen")
                btn.classList.remove("a")
            }
        )


    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }




        a {
            text-decoration: none;


        }


        .container {
            max-width: 1280px;
            margin: auto;
        }


        /* Header */
        header {
            z-index: 100;
            position: fixed;
            display: flex;
            justify-content: space-between;
            width: 100%;


            .headerContent {
                width: 100%;
                display: flex;
                justify-content: space-between;
                max-width: 1200px;
                margin: auto;
                margin-top: 10px;


                @media(max-width: 1200px) {
                    margin: 10px 20px;
                }
            }


            .logo {
                width: 150px;
                height: 60px;
                background-color: #212121bd;
                border-radius: 40px;
                display: flex;
                justify-content: center;
                align-items: center;
                border: 2px #f0f0f0b8 solid;


                .logoImg {
                    width: 90%;
                }
            }


            nav {
                background-color: #212121d0;
                border-radius: 40px;
                display: flex;
                justify-content: space-evenly;
                align-items: center;
                border: 2px #f0f0f0b8 solid;
                width: 450px;
                height: 60px;


                button {
                    background-color: #FFD223;
                    height: 50px;
                    width: 100px;
                    border-radius: 50px;
                    color: white;
                    border: none;
                    margin-right: -18px;


                    &:hover {
                        background-color: #CAA61B;
                    }
                }


                a {
                    color: white;


                    &:hover {
                        color: #FFD223;
                    }
                }
            }


            .menu {
                display: none;
            }


            .close {
                display: none;
            }


            @media(max-width: 700px) {
                .headerContent {
                    flex-direction: row-reverse;
                }


                nav {
                    position: fixed;
                    transform: translateX(-1000%);
                    top: 0;
                    left: 0;
                    width: 50%;
                    height: 100vh;
                    flex-direction: column;
                    border-radius: 0px;
                    align-items: center;
                    justify-content: flex-start;
                    gap: 50px;
                    padding: 70px 20px;


                    img {
                        width: 30px;
                    }


                    a {
                        font-size: 26px;
                        text-align: center;
                    }


                    button {
                        margin-left: -20px;
                        width: 190px;
                        font-size: 20px;
                    }
                }


                .menu {
                    display: block;
                    width: 60px;
                    height: 60px;
                    margin-right: 20px;
                    padding: 10px;
                    background-color: #212121bd;
                    border-radius: 40px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    border: 2px #f0f0f0b8 solid;


                    img {
                        width: 30px;
                        height: 25px;
                    }
                }


                .close {
                    display: block;
                    width: 20px;
                    height: 20px;
                    position: absolute;
                    right: 10px;
                    top: 10px;
                }
            }
        }


        .itsOpen {
            transform: translateX(0);
        }


        .a {
            transform: translateX(-100px);
        }
    </style>
</body>

</html>
